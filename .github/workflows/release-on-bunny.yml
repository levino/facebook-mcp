name: Deploy Bunny Scripting Script

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  update-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno task build

      - name: Publish the script to Bunny
        uses: "BunnyWay/actions/deploy-script@931a74b9c45ea9f9f01435fbbf1649830e67d3b3" # main
        with:
          script_id: 77480
          file: "dist/main.js"
